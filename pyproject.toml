[project]
name = "cicd-example"
version = "0.1.0"
description = "A dummy weather project used to demonstrate CI/CD."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
weather = "weather.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
